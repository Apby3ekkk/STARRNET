    width: 10px;
    height: 18px;
    background: #ffdd33;
    box-shadow: 0 0 10px #ffdd33, 0 0 24px rgba(255, 200, 40, 0.6);
    animation: blink 1s steps(1) infinite;
    pointer-events: none;
    z-index: 10;
    opacity: 0.95;
    transition: opacity 0.3s;

  @keyframes blink {

  }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at center,

    inset: 0;
    display: none;
    align-items: center;

    flex-direction: column;
    gap: 16px;
    background: #000;
    color: #ffdd33;
    font-family: 'Courier New', monospace;
    z-index: 100;
    text-shadow: 0 0 12px #ffdd33;
    animation: fadeGoodbye 0.4s ease;

  .goodbye.visible { display: flex; }

  .goodbye .big {
    font-size: 28px;
    letter-spacing: 6px;
  }

  .goodbye .small {
    font-size: 14px;
    color: #b8901a;
    letter-spacing: 2px;
  }

  @keyframes fadeGoodbye {
    from { opacity: 0; }
    to   { opacity: 1; }

<script>
  const TYPE_DELAY_MIN = 3;
  const TYPE_DELAY_MAX = 10;
  const KICK_DELAY     = 5000;

  const BINARY_TEXT = document.getElementById('binarySource').textContent.replace(/^\s+|\s+$/g, '');

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('selectstart', e => e.preventDefault());
  document.addEventListener('dragstart',   e => e.preventDefault());

  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    const blocked =
      (e.ctrlKey && ['c','a','x','u','s','p'].includes(k)) ||
      e.key === 'F12';
    if (blocked) { e.preventDefault(); return false; }
  });

  document.addEventListener('copy', e => {
    e.preventDefault();
    e.clipboardData.setData('text/plain', 'Копирование запрещено');
  });

  const canvas = document.getElementById('binaryCanvas');
  const ctx    = canvas.getContext('2d');
  const caret  = document.getElementById('caret');
  const goodbye = document.getElementById('goodbye');

  const FONT_SIZE = 16;
  const LINE_H    = 22;
  const CHAR_W    = 11;

  let cols = 0, rows = 0;
  let charX = 0, charY = 0;
  let symbols = [];

  function resize() {
    canvas.width  = window.innerWidth  * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width  = window.innerWidth  + 'px';
    canvas.style.height = window.innerHeight + 'px';

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(devicePixelRatio, devicePixelRatio);

    cols = Math.floor(window.innerWidth  / CHAR_W);
    rows = Math.floor(window.innerHeight / LINE_H);

    redrawAll();
  }
  window.addEventListener('resize', resize);

  function drawChar(ch, col, row, brightness) {
    const x = col * CHAR_W;
    const y = row * LINE_H + FONT_SIZE;

    const r = Math.floor(110 + brightness * 145);
    const g = Math.floor( 80 + brightness * 160);
    const b = Math.floor( 10 + brightness * 110);

    ctx.fillStyle = rgb(${r}, ${g}, ${b});

    if (brightness > 0.85) {
      ctx.shadowColor = '#ffdd33';
      ctx.shadowBlur  = 14;
    } else if (brightness > 0.5) {
      ctx.shadowColor = 'rgba(255, 200, 40, 0.6)';
      ctx.shadowBlur  = 6;
    } else {
      ctx.shadowBlur = 0;
    }

    ctx.fillText(ch, x, y);
    ctx.shadowBlur = 0;
  }

  function redrawAll() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = ${FONT_SIZE}px 'Courier New', monospace;
    ctx.textBaseline = 'alphabetic';

    for (const s of symbols) {
      if (s.col < cols && s.row < rows) {
        drawChar(s.char, s.col, s.row, s.brightness);
      }
    }
    updateCaret();
  }

  function updateCaret() {
    caret.style.left = (charX * CHAR_W) + 'px';
    caret.style.top  = (charY * LINE_H + 4) + 'px';
  }

  let index = 0;

  function typeChar(ch) {
    if (ch === '\n') {
      charX = 0;
      charY++;
    } else {
      symbols.push({ char: ch, col: charX, row: charY, brightness: 1 });

      ctx.font = ${FONT_SIZE}px 'Courier New', monospace;
      drawChar(ch, charX, charY, 1);

      charX++;
      if (charX >= cols) { charX = 0; charY++; }
    }

    if (charY >= rows) {
      symbols = symbols
        .map(s => ({ ...s, row: s.row - 1, brightness: s.brightness * 0.9 }))
        .filter(s => s.row >= 0);
      charY = rows - 1;
      redrawAll();
    }

    updateCaret();
  }

  function typeNext() {
    if (index >= BINARY_TEXT.length) {
caret.style.opacity = '0';
      setTimeout(kickOut, KICK_DELAY);
      return;
    }

    const ch = BINARY_TEXT[index];
    index++;
    typeChar(ch);

    const delay = TYPE_DELAY_MIN + Math.random() * (TYPE_DELAY_MAX - TYPE_DELAY_MIN);
    setTimeout(typeNext, delay);
  }

  setInterval(() => {
    let changed = false;
    for (const s of symbols) {
      if (s.brightness > 0.15) {
        s.brightness = Math.max(0.15, s.brightness - 0.006);
        changed = true;
      }
    }
    if (changed) redrawAll();
  }, 90);

  function kickOut() {
    goodbye.classList.add('visible');

    window.open('', '_self', '');
    window.close();

    setTimeout(() => {
      try {
        window.location.replace('about:blank');
      } catch (e) {}
    }, 1500);

    setTimeout(() => {
      try {
        document.documentElement.innerHTML = '';
        document.body.style.background = '#000';
      } catch (e) {}
    }, 2500);
  }

  resize();
  setTimeout(typeNext, 400);
</script>
